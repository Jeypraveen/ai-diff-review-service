services:
  - type: web
    name: ai-diff-review
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: BEARER_TOKEN
        sync: false
      - key: GROQ_API_KEY
        sync: false
    healthCheckPath: /health
